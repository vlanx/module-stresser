apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cpu-stress
  namespace: stress
spec:
  # -- base pod template for the CPU containeres
  templates:
  - name: cpu-stress-container
    inputs:
      parameters:
        - name: image
        - name: workers
        - name: load
        - name: timeout
        - name: cpuset
        - name: display
        # resources as parameters (safe here because this is a STRING patch)
        - { name: cpu_req, value: "1" }
        - { name: cpu_lim, value: "1" }
        - { name: mem_req, value: "1Gi" }
        - { name: mem_lim, value: "1Gi" }
    metadata:
      annotations:
        workflows.argoproj.io/display-name: "{{inputs.parameters.display}}"
    nodeSelector:
      role: stress
        # <<— podSpecPatch lives on the TEMPLATE, not the step
    podSpecPatch: |
      containers:
      - name: main
        resources:
          requests:
            cpu: "{{inputs.parameters.cpu_req}}"
            memory: "{{inputs.parameters.mem_req}}"
          limits:
            cpu: "{{inputs.parameters.cpu_lim}}"
            memory: "{{inputs.parameters.mem_lim}}"
    container:
      image: "{{inputs.parameters.image}}"
      imagePullPolicy: IfNotPresent
      env:
        - name: WORKERS
          value: "{{inputs.parameters.workers}}"
        - name: LOAD
          value: "{{inputs.parameters.load}}"
        - name: TIMEOUT
          value: "{{inputs.parameters.timeout}}"
        - name: CPUSET
          value: "{{inputs.parameters.cpuset}}"
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
