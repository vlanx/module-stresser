### APP ###
# MAX VUSERS = 400 which is ~96% success rate

    - - name: k6-sine-80vu-ultrap3-performance
        templateRef:
          name: k6-runner          # WorkflowTemplate name
          template: k6-test-container  # inner template name
        arguments:
          parameters:
          - { name: image,            value: grafana/k6:latest }
          - { name: script_configmap, value: k6-sine-script }
          - { name: script_file,      value: script.js }

          - { name: BASE_URL,         value: "http://quickpizza-public-api.ultrap3.svc.cluster.local:3333" }
          - { name: DURATION,         value: "600" }   # seconds per cycle
          - { name: MAX_VUSERS,       value: "80" }  # peak VUs multiplier

          - { name: k6_args,          value: "--verbose" }
          - { name: display,          value: "K6-600s-80vu" }

          # Resource tuning (can adjust per step)
          - { name: cpu_req,          value: "32" }
          - { name: cpu_lim,          value: "32" }
          - { name: mem_req,          value: "8Gi" }
          - { name: mem_lim,          value: "64Gi" }

    - - name: cooldown-1app
        template: cooldown

    - - name: k6-sine-160vu-ultrap3-performance
        templateRef:
          name: k6-runner          # WorkflowTemplate name
          template: k6-test-container  # inner template name
