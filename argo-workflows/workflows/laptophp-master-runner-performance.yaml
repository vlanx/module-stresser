          name: memory-stress      # WorkflowTemplate name (same namespace)
          template: memory-stress-container         # inner template name
        arguments:
          parameters:
          - { name: image,   value: ghcr.io/vlanx/memory-stress:latest }
          - { name: workers, value: "16" }
          - { name: read_mbps,    value: "-1" } # Value -1 disables cap on read speed. Value 0 disables reads
          - { name: write_mbps, value: "-1" } # Value -1 disables cap on read speed. Value 0 disables reads
          - { name: timeout,  value: "10m" }
          - { name: size,  value: "0.5" } # Size in Gb for the memory test
          - { name: memrate_flush,  value: true } 
          - { name: memrate_method,  value: "all" } 
          - { name: cpuset, value: "0-15" }
          - { name: display, value: "memory-6G-10m" }
          ### CPU Requests/Limits for when we want more workers/cores
          #- { name: cpu_req, value: "24" }
          #- { name: cpu_lim, value: "24" }
            #- { name: mem_req, value: "1Gi" }
          - { name: mem_lim, value: "32Gi" }

