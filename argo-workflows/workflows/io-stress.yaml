          ### CPU Requests/Limits for when we want more workers/cores
          - { name: cpu_req, value: "1" }
          - { name: cpu_lim, value: "1" }
          - { name: mem_req, value: "512Mi" }
          - { name: mem_lim, value: "512Mi" }

    - - name: cooldown-2
        template: cooldown

    - - name: seq-write-12g-10m-166mbps
