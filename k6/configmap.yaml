apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-sine-script
  namespace: stress
data:
  script.js: |
    import http from "k6/http";
    import { sleep } from "k6";
    import { Counter, Rate } from "k6/metrics";

    // ---------------------------------------
    // TEST PARAMETERS (env-driven, minimal)
    // ---------------------------------------
    // Support both UPPER_CASE and lower_case for convenience
    const BASE_URL = __ENV.BASE_URL;
    const MAX_VUSERS = Number(__ENV.MAX_VUSERS || "1000");
    const DURATION = Number(__ENV.DURATION || "600"); // seconds

    if (!BASE_URL) {
      throw new Error("BASE_URL env var is required");
    }
    if (MAX_VUSERS <= 0) {
      throw new Error("MAX_VUSERS must be > 0");
    }
    if (DURATION <= 0) {
      throw new Error("DURATION must be > 0");
    }

    // Split total test duration into ramp-up and ramp-down.
    // No hold, no extra envs.
    const rampUp = DURATION / 2;
    const rampDown = DURATION - rampUp; // handles odd numbers cleanly

    export const options = {
      stages: [
        // Ramp from 0 → MAX_VUSERS
        { duration: `${rampUp}s`, target: MAX_VUSERS },
        // Ramp from MAX_VUSERS → 0
        { duration: `${rampDown}s`, target: 0 },
      ],
    };

    const payload = JSON.stringify({
      customName: "",
      excludedIngredients: [],
      excludedTools: [],
      maxCaloriesPerSlice: 1000,
      maxNumberOfToppings: 5,
      minNumberOfToppings: 2,
      mustBeVegetarian: false,
    });

    const pizzaUrl = `${BASE_URL}/api/pizza`;

    const responses2xx = new Counter("responses_2xx");
    const responses4xx = new Counter("responses_4xx");
    const responses5xx = new Counter("responses_5xx");
    const rate2xx = new Rate("responses_2xx_rate");
    const rate4xx = new Rate("responses_4xx_rate");
    const rate5xx = new Rate("responses_5xx_rate");

    // ---------------------------------------
    // HTTP HEADERS
    // ---------------------------------------
    const params = {
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Token 3Mz1ZUX60dGNNYqH",
      },
    };

    // ---------------------------------------
    // MAIN REQUEST LOOP
    // ---------------------------------------
    export default function () {
      const res = http.post(pizzaUrl, payload, params);
      const is2xx = res.status >= 200 && res.status < 300;
      const is4xx = res.status >= 400 && res.status < 500;
      const is5xx = res.status >= 500 && res.status < 600;

      if (is2xx) responses2xx.add(1);
      if (is4xx) responses4xx.add(1);
      if (is5xx) responses5xx.add(1);

      rate2xx.add(is2xx);
      rate4xx.add(is4xx);
      rate5xx.add(is5xx);

      // ~1 request per active VU per second
      sleep(1);
    }
