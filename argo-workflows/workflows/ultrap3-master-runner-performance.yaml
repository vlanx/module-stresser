          - { name: write_mbps, value: "-1" } # Value -1 disables cap on read speed. Value 0 disables reads
          - { name: timeout,  value: "10m" }
          - { name: size,  value: "1" } # Size in Gb for the memory test
          - { name: memrate_flush,  value: true } 
          - { name: memrate_method,  value: "all" } 
